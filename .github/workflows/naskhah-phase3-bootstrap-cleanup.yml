name: Naskhah Studio Phase 3 Bootstrap Cleanup

on:
  push:
    branches:
      - naskhah-phase3-app-modularization
    paths:
      - .github/workflows/naskhah-phase3-bootstrap-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: naskhah-phase3-app-modularization
          fetch-depth: 0

      - name: Remove legacy bootstrap implementations
        run: node naskhah-studio/tools/scripts/cleanup-app-bootstrap.mjs

      - name: Verify app.js syntax
        run: node --check naskhah-studio/app.js

      - name: Verify Phase 2 strict runtime guard
        working-directory: naskhah-studio
        run: node tools/scripts/check-runtime.mjs

      - name: Verify Phase 3 guard
        run: node naskhah-studio/tools/scripts/check-phase3-baseline.mjs

      - name: Commit cleanup
        run: |
          if git diff --quiet -- naskhah-studio/app.js naskhah-studio/tools/scripts/check-runtime.mjs naskhah-studio/tools/scripts/check-phase3-baseline.mjs; then
            echo "No I2 cleanup change detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naskhah-studio/app.js naskhah-studio/tools/scripts/check-runtime.mjs naskhah-studio/tools/scripts/check-phase3-baseline.mjs
          git commit -m "Phase 3 I2: remove duplicated bootstrap auth wiring"
          git push origin HEAD:naskhah-phase3-app-modularization
