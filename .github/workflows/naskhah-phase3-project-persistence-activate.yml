name: Naskhah Studio Phase 3 Project Persistence Activate

on:
  push:
    branches:
      - naskhah-phase3-app-modularization
    paths:
      - .github/workflows/naskhah-phase3-project-persistence-activate.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: naskhah-phase3-app-modularization
          fetch-depth: 0

      - name: Activate project persistence module
        run: node naskhah-studio/tools/scripts/activate-project-persistence.mjs

      - name: Verify Phase 3 guard
        run: node naskhah-studio/tools/scripts/check-phase3-baseline.mjs

      - name: Commit activation
        run: |
          if git diff --quiet -- naskhah-studio/index.html naskhah-studio/tools/scripts/check-phase3-baseline.mjs; then
            echo "No G1 activation change detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naskhah-studio/index.html naskhah-studio/tools/scripts/check-phase3-baseline.mjs
          git commit -m "Phase 3 G1: activate project persistence module"
          git push origin HEAD:naskhah-phase3-app-modularization
