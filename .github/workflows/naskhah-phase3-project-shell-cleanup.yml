name: Naskhah Studio Phase 3 Project Shell Cleanup

on:
  push:
    branches:
      - naskhah-phase3-app-modularization
    paths:
      - .github/workflows/naskhah-phase3-project-shell-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: naskhah-phase3-app-modularization
          fetch-depth: 0

      - name: Run deterministic app.js project-shell cleanup
        run: node naskhah-studio/tools/scripts/cleanup-app-project-shell.mjs

      - name: Verify app.js syntax
        run: node --check naskhah-studio/app.js

      - name: Commit cleaned app.js
        run: |
          if git diff --quiet -- naskhah-studio/app.js; then
            echo "No app.js cleanup change detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naskhah-studio/app.js
          git commit -m "Phase 3 cleanup F2: remove duplicated project shell implementations"
          git push origin HEAD:naskhah-phase3-app-modularization
