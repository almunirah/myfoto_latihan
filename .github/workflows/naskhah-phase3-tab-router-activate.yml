name: Naskhah Studio Phase 3 Tab Router Activate

on:
  push:
    branches:
      - naskhah-phase3-app-modularization
    paths:
      - .github/workflows/naskhah-phase3-tab-router-activate.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: naskhah-phase3-app-modularization
          fetch-depth: 0

      - name: Activate J1 guard ownership
        run: node naskhah-studio/tools/scripts/activate-tab-router-guards.mjs

      - name: Verify Phase 2 runtime guard
        run: node naskhah-studio/tools/scripts/check-runtime.mjs

      - name: Verify Phase 3 guard
        run: node naskhah-studio/tools/scripts/check-phase3-baseline.mjs

      - name: Commit activated guards
        run: |
          if git diff --quiet -- naskhah-studio/tools/scripts/check-runtime.mjs naskhah-studio/tools/scripts/check-phase3-baseline.mjs; then
            echo "No J1 guard change detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naskhah-studio/tools/scripts/check-runtime.mjs naskhah-studio/tools/scripts/check-phase3-baseline.mjs
          git commit -m "Phase 3 J1: activate tab-router ownership guards"
          git push origin HEAD:naskhah-phase3-app-modularization
